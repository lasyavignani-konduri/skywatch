<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

// Clock (IST)
const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false});
(function t(){ $('#clock').textContent=f.format(new Date())+' IST'; setTimeout(t,1000); })();

// URL Query Params
const urlParams=new URLSearchParams(window.location.search);
const page=urlParams.get('page')||'glossary';
const paramTerm=urlParams.get('term')||'';
const paramTopic=urlParams.get('topic')||'';
const paramTut=urlParams.get('tut')||'';

// Update Sidebar Active state
function updateSidebar(){
  $$('.side .it').forEach(el=>el.classList.remove('act'));
  const targetId='sb-'+page;
  const targetEl=document.getElementById(targetId);
  if(targetEl){
    targetEl.classList.add('act');
  } else if(page==='topics'){
    const lEl=document.getElementById('sb-learning');
    if(lEl) lEl.classList.add('act');
  }
}
updateSidebar();

// Progress store
const PROGRESS_KEY='skywatch.learning.progress';
function getProgress(){
  try{
    const v=localStorage.getItem(PROGRESS_KEY);
    return v!==null&&!isNaN(+v)?+v:60;
  }catch(e){return 60;}
}
function setProgress(p){
  p=Math.max(0,Math.min(100,Math.round(p)));
  try{ localStorage.setItem(PROGRESS_KEY,String(p)); }catch(e){}
}
function addProgress(delta){
  const cur=getProgress();
  setProgress(cur+delta);
}

// Global data stores
let GLOSSARY_DATA=[];
let TUTORIALS_DATA=[];
let BP_DATA=[];
let FAQS_DATA=[];
let TOPICS_DATA=[];

const ICONS={
  anomalies:`<svg viewBox="0 0 42 42" fill="none" stroke="#2fa7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="17"/><line x1="21" y1="4" x2="21" y2="38"/><line x1="4" y1="21" x2="38" y2="21"/><path d="M21 21l9-9"/></svg>`,
  alerts:`<svg viewBox="0 0 42 42" fill="none" stroke="#2fa7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5l16 28H5z"/><line x1="21" y1="16" x2="21" y2="23"/><circle cx="21" cy="28" r="1.4" fill="#2fa7ff"/></svg>`,
  weather:`<svg viewBox="0 0 42 42" fill="none" stroke="#2fa7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 28a7 7 0 01-1-14 9 9 0 0117-2 6 6 0 016 7 5 5 0 01-4 9H12z"/></svg>`,
  runway:`<svg viewBox="0 0 42 42" fill="none" stroke="#2fa7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="6" width="24" height="30" rx="3"/><line x1="21" y1="10" x2="21" y2="15"/><line x1="21" y1="20" x2="21" y2="25"/><line x1="21" y1="30" x2="21" y2="35"/></svg>`,
  metrics:`<svg viewBox="0 0 42 42" fill="none" stroke="#2fa7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 34l8-10 8 6 14-16"/></svg>`,
  system:`<svg viewBox="0 0 42 42" fill="none" stroke="#2fa7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="6"/><path d="M18 5h6l1 4 3 2 4-1 3 5-3 3v4l3 3-3 5-4-1-3 2-1 4h-6l-1-4-3-2-4 1-3-5 3-3v-4l-3-3 3-5 4 1 3-2z"/></svg>`
};

/* ============================ GLOSSARY VIEW ============================ */
function renderGlossary(terms){
  let selectedId=terms[0]?.id||'';
  if(paramTerm){
    const found=terms.find(t=>t.term.toLowerCase()===paramTerm.toLowerCase()||t.id===paramTerm.toLowerCase());
    if(found) selectedId=found.id;
  }
  let activeCat='All';
  let activeLetter='All';
  let searchTerm='';

  const letters=['All','A','C','D','F','G','H','L','M','N','Q','R','S','T','V'];
  const cats=['All','Anomalies','Weather','Airspace','Metrics','System'];

  const container=$('#content');
  container.innerHTML=`
    <div class="gl-layout">
      <div class="sub-hdr">
        <div class="sub-title">
          <h1>Aviation Glossary</h1>
          <p>Official terminology, radar classifications, and meteorological standards.</p>
        </div>
        <div class="sub-pill-count" id="glCount">${terms.length} Terms Available</div>
      </div>

      <div class="gl-ctrls">
        <div class="search-box" style="width:calc(var(--u)*320)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="glSearch" placeholder="Search terms, definitions...">
        </div>
        <div class="chip-group" id="glChips">
          ${cats.map(c=>`<button class="f-chip ${c==='All'?'on':''}" data-cat="${c}">${c}</button>`).join('')}
        </div>
      </div>

      <div class="gl-letters" id="glLetters">
        ${letters.map(l=>`<button class="gl-lbtn ${l==='All'?'on':''}" data-let="${l}">${l}</button>`).join('')}
      </div>

      <div class="gl-body">
        <div class="gl-list" id="glList"></div>
        <div class="card gl-detail" id="glDetail"></div>
      </div>
    </div>
  `;

  function filterTerms(){
    return terms.filter(t=>{
      const matchSearch=!searchTerm || (t.term+t.title+t.shortDef+t.fullDef).toLowerCase().includes(searchTerm.toLowerCase());
      const matchCat=(activeCat==='All') || (t.category && t.category.toLowerCase().includes(activeCat.toLowerCase())) || (activeCat==='Airspace' && t.category==='runway-airspace');
      const matchLet=(activeLetter==='All') || t.term.toUpperCase().startsWith(activeLetter);
      return matchSearch && matchCat && matchLet;
    });
  }

  function renderList(){
    const filtered=filterTerms();
    $('#glCount').textContent=`${filtered.length} of ${terms.length} Terms`;
    const listEl=$('#glList');
    if(!filtered.length){
      listEl.innerHTML=`<div class="card" style="padding:calc(var(--u)*24);text-align:center;color:var(--muted);">No matching aviation terms found.</div>`;
      return;
    }
    listEl.innerHTML=filtered.map(t=>{
      const isSel=t.id===selectedId;
      const sevBadge=t.severity==='High'?'<span class="badge badge-red">High</span>':t.severity==='Medium'?'<span class="badge badge-amber">Medium</span>':t.severity==='Low'?'<span class="badge badge-blue">Low</span>':'';
      return `
        <div class="gl-item ${isSel?'sel':''}" data-id="${t.id}">
          <div class="gl-item-top">
            <span class="gl-item-term">${t.term}</span>
            <div style="display:flex;gap:calc(var(--u)*6)">
              <span class="badge badge-blue">${t.category}</span>
              ${sevBadge}
            </div>
          </div>
          <div class="gl-item-title">${t.title}</div>
          <div class="gl-item-def">${t.shortDef}</div>
        </div>
      `;
    }).join('');

    $$('.gl-item').forEach(el=>{
      el.addEventListener('click',()=>{
        selectedId=el.dataset.id;
        renderList();
        renderDetail();
      });
    });
  }

  function renderDetail(){
    const t=terms.find(item=>item.id===selectedId) || terms[0];
    if(!t) return;
    const detailEl=$('#glDetail');
    const sevBadge=t.severity==='High'?'<span class="badge badge-red">High Severity</span>':t.severity==='Medium'?'<span class="badge badge-amber">Medium Severity</span>':t.severity==='Low'?'<span class="badge badge-blue">Low Severity</span>':'<span class="badge badge-blue">Informational</span>';

    const paramsHtml=(t.keyParameters||[]).map(p=>`
      <tr>
        <td style="color:var(--soft);font-weight:500">${p.param}</td>
        <td class="val">${p.value}</td>
        <td style="color:var(--muted)">${p.meaning}</td>
      </tr>
    `).join('');

    const relatedHtml=(t.relatedTerms||[]).map(r=>`<button class="gl-rel-tag" data-rel="${r}">${r}</button>`).join('');

    detailEl.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:calc(var(--u)*4)">
        <h2>${t.term}</h2>
        <div style="display:flex;gap:calc(var(--u)*6)">
          <span class="badge badge-blue">${t.category}</span>
          ${sevBadge}
        </div>
      </div>
      <div class="gl-detail-title">${t.title}</div>

      <div class="gl-box">
        <h4>In Plain Language</h4>
        <p>${t.fullDef}</p>
      </div>

      <div class="gl-box">
        <h4>Operational Context (VOHS / ATC)</h4>
        <p>${t.operationalContext}</p>
      </div>

      ${paramsHtml?`
      <div class="gl-box">
        <h4>Key Thresholds &amp; Parameters</h4>
        <table class="gl-table">
          <tbody>${paramsHtml}</tbody>
        </table>
      </div>`:''}

      ${relatedHtml?`
      <div style="margin-top:calc(var(--u)*4);margin-bottom:calc(var(--u)*14)">
        <div style="font-size:calc(var(--u)*13.5);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:calc(var(--u)*6)">Related Terms</div>
        <div class="gl-related">${relatedHtml}</div>
      </div>`:''}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:calc(var(--u)*12)">
        <button class="btn" id="btnLearn" style="height:calc(var(--u)*38);padding:0 calc(var(--u)*20);font-size:calc(var(--u)*15)">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          <span id="btnLearnTxt">Mark as Learned</span>
        </button>
        <span style="font-size:calc(var(--u)*14);color:var(--muted)">SkyWatch Knowledge Base</span>
      </div>
    `;

    $$('.gl-rel-tag').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const relName=btn.dataset.rel;
        const target=terms.find(x=>x.term.toLowerCase()===relName.toLowerCase() || x.id.toLowerCase()===relName.toLowerCase() || relName.toLowerCase().includes(x.term.toLowerCase()));
        if(target){
          selectedId=target.id;
          activeCat='All';
          activeLetter='All';
          searchTerm='';
          $('#glSearch').value='';
          $$('.f-chip').forEach(c=>c.classList.toggle('on',c.dataset.cat==='All'));
          $$('.gl-lbtn').forEach(l=>l.classList.toggle('on',l.dataset.let==='All'));
          renderList();
          renderDetail();
          const targetEl=document.querySelector(`.gl-item[data-id="${target.id}"]`);
          if(targetEl) targetEl.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      });
    });

    $('#btnLearn').addEventListener('click',()=>{
      addProgress(5);
      $('#btnLearnTxt').textContent='Learned (+5% XP)';
      $('#btnLearn').style.filter='brightness(1.2)';
    });
  }

  $('#glSearch').addEventListener('input',e=>{ searchTerm=e.target.value; renderList(); });

  $$('#glChips .f-chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      $$('#glChips .f-chip').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      activeCat=btn.dataset.cat;
      renderList();
    });
  });

  $$('#glLetters .gl-lbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      $$('#glLetters .gl-lbtn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      activeLetter=btn.dataset.let;
      renderList();
    });
  });

  renderList();
  renderDetail();
}

/* ============================ TUTORIALS VIEW ============================ */
function renderTutorials(tuts){
  const container=$('#content');
  container.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="sub-hdr">
        <div class="sub-title">
          <h1>Interactive Operations Tutorials</h1>
          <p>Guided walkthroughs for approach stabilization, emergency response, and METAR decoding.</p>
        </div>
        <div class="sub-pill-count">${tuts.length} Walkthrough Modules</div>
      </div>
      <div class="tut-grid" id="tutGrid"></div>
    </div>
    <div id="modalHost"></div>
  `;

  $('#tutGrid').innerHTML=tuts.map((tut,i)=>`
    <div class="card tut-card">
      <div>
        <div class="tut-card-top">
          <span class="badge badge-blue">${tut.level}</span>
          <span style="font-size:calc(var(--u)*14);color:var(--muted)">${tut.duration}</span>
        </div>
        <h3>${tut.title}</h3>
        <p>${tut.summary}</p>
      </div>
      <div class="tut-card-bot">
        <span style="font-size:calc(var(--u)*15);color:var(--acc-hi);font-weight:600">${tut.steps.length} Steps</span>
        <button class="btn btn-open-tut" data-idx="${i}" style="height:calc(var(--u)*38);padding:0 calc(var(--u)*18);font-size:calc(var(--u)*15)">
          Start Walkthrough <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  `).join('');

  $$('.btn-open-tut').forEach(b=>{
    b.addEventListener('click',()=>{
      const idx=+b.dataset.idx;
      openTutorialModal(tuts[idx]);
    });
  });

  if(paramTut){
    const match=tuts.find(t=>t.id===paramTut);
    if(match) openTutorialModal(match);
  }
}

function openTutorialModal(tut){
  let stepIdx=0;
  const host=$('#modalHost');

  function renderStep(){
    const s=tut.steps[stepIdx];
    const isLast=stepIdx===tut.steps.length-1;

    host.innerHTML=`
      <div class="modal-overlay">
        <div class="card modal-card">
          <div class="modal-hdr">
            <div>
              <span class="badge badge-blue" style="margin-bottom:calc(var(--u)*4)">${tut.badge||'Operations Walkthrough'}</span>
              <h2>${tut.title}</h2>
            </div>
            <button class="close-btn" id="btnModalClose">
              <svg viewBox="0 0 24 24" style="width:calc(var(--u)*20);height:calc(var(--u)*20);stroke:#fff;fill:none;stroke-width:2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div class="step-nav">
            ${tut.steps.map((st,i)=>`
              <div class="step-dot ${i===stepIdx?'active':i<stepIdx?'done':''}"></div>
            `).join('')}
            <span style="font-size:calc(var(--u)*14.5);color:var(--muted);margin-left:calc(var(--u)*8)">Step ${stepIdx+1} of ${tut.steps.length}</span>
          </div>

          <div class="step-body">
            <h3 style="font-size:calc(var(--u)*24);font-weight:700;color:var(--acc-hi)">${s.title}</h3>
            <p style="font-size:calc(var(--u)*17.5);line-height:1.45;color:#f1f5f9">${s.body}</p>
            ${s.callout?`
              <div class="callout-box">
                <b>Operational Protocol:</b> ${s.callout}
              </div>
            `:''}
            <div class="card" style="padding:calc(var(--u)*16);margin-top:calc(var(--u)*10);background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.08)">
              <div style="font-size:calc(var(--u)*14);color:var(--muted);margin-bottom:calc(var(--u)*4)">Live Radar Telemetry Corroboration</div>
              <div style="font-size:calc(var(--u)*16);color:var(--soft);font-family:monospace">Target: AIC2417 · VOHS RWY 09 · Descent Envelope Monitored</div>
            </div>
          </div>

          <div class="modal-ftr">
            <button class="btn-sec" id="btnStepPrev" style="height:calc(var(--u)*40);padding:0 calc(var(--u)*20);font-size:calc(var(--u)*15)" ${stepIdx===0?'disabled style="opacity:.4;cursor:default"':''}>
              Previous Step
            </button>
            <button class="btn" id="btnStepNext" style="height:calc(var(--u)*40);padding:0 calc(var(--u)*24);font-size:calc(var(--u)*15)">
              ${isLast?'Finish &amp; Complete Tutorial':'Next Step'}
              <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;

    $('#btnModalClose').addEventListener('click',()=>{ host.innerHTML=''; });
    $('#btnStepPrev').addEventListener('click',()=>{
      if(stepIdx>0){ stepIdx--; renderStep(); }
    });
    $('#btnStepNext').addEventListener('click',()=>{
      if(!isLast){
        stepIdx++;
        renderStep();
      } else {
        addProgress(10);
        alert('Tutorial Completed! +10% Progress added to your Learning Hub.');
        host.innerHTML='';
      }
    });
  }

  renderStep();
}

/* ============================ BEST PRACTICES VIEW ============================ */
function renderBestPractices(list){
  const container=$('#content');
  let filter='All';
  let query='';

  container.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="sub-hdr">
        <div class="sub-title">
          <h1>Controller Best Practices &amp; SOPs</h1>
          <p>Standardized operational procedures compliant with ICAO Doc 4444 and DGCA CAR.</p>
        </div>
        <div class="sub-pill-count">${list.length} Checklists</div>
      </div>

      <div style="display:flex;align-items:center;gap:calc(var(--u)*16);margin-bottom:calc(var(--u)*12)">
        <div class="search-box" style="width:calc(var(--u)*340)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="bpSearch" placeholder="Search rules, procedures, checklists...">
        </div>
        <div class="chip-group" id="bpChips">
          ${['All','Approach Stabilization','Emergency Response','Weather Operations','Separation Standards'].map(c=>`
            <button class="f-chip ${c==='All'?'on':''}" data-cat="${c}">${c}</button>
          `).join('')}
        </div>
      </div>

      <div class="bp-list" id="bpList"></div>
    </div>
  `;

  function renderItems(){
    const filtered=list.filter(item=>{
      const matchQ=!query||(item.title+item.summary+item.rationale).toLowerCase().includes(query.toLowerCase());
      const matchC=filter==='All'||item.category===filter;
      return matchQ && matchC;
    });

    $('#bpList').innerHTML=filtered.map((item,i)=>`
      <div class="card bp-card" data-idx="${i}">
        <div class="bp-card-top">
          <div style="display:flex;align-items:center;gap:calc(var(--u)*12)">
            <span class="badge ${item.priority==='Mandatory'?'badge-red':'badge-blue'}">${item.priority}</span>
            <h3>${item.title}</h3>
            <span class="badge badge-blue">${item.category}</span>
          </div>
          <svg class="bp-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div style="font-size:calc(var(--u)*16);color:var(--soft);margin-top:calc(var(--u)*8)">${item.summary}</div>

        <div class="bp-content">
          <div style="font-size:calc(var(--u)*14.5);font-weight:700;color:var(--acc-hi);text-transform:uppercase;letter-spacing:.04em;margin-bottom:calc(var(--u)*8)">Action Checklist</div>
          <div class="bp-checklist">
            ${(item.checklist||[]).map(chk=>`
              <div class="bp-chk">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                <span>${chk}</span>
              </div>
            `).join('')}
          </div>

          <div style="display:flex;gap:calc(var(--u)*20);margin-top:calc(var(--u)*16);border-top:1px solid rgba(255,255,255,.08);padding-top:calc(var(--u)*12)">
            <div style="flex:1">
              <div style="font-size:calc(var(--u)*14);font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:calc(var(--u)*4)">Regulatory Rationale</div>
              <p style="font-size:calc(var(--u)*15.5);color:var(--soft);line-height:1.4">${item.rationale}</p>
            </div>
            <div style="flex:1">

/* ============================ FAQS VIEW ============================ */
function renderFaqs(faqs){
  const container=$('#content');
  let filter='All';
  let query='';

  container.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="sub-hdr">
        <div class="sub-title">
          <h1>Aviation Knowledge Base &amp; FAQs</h1>
          <p>Common operational questions regarding radar surveillance, METAR observations, and alerts.</p>
        </div>
        <div class="sub-pill-count">${faqs.length} FAQs</div>
      </div>

      <div style="display:flex;align-items:center;gap:calc(var(--u)*16);margin-bottom:calc(var(--u)*12)">
        <div class="search-box" style="width:calc(var(--u)*340)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="faqSearch" placeholder="Search questions or keywords...">
        </div>
        <div class="chip-group" id="faqChips">
          ${['All','General','Radar & Tracking','Anomalies & Alerts','Weather & METAR','Metrics & Performance'].map(c=>`
            <button class="f-chip ${c==='All'?'on':''}" data-cat="${c}">${c}</button>
          `).join('')}
        </div>
      </div>

      <div class="faq-list" id="faqList"></div>
    </div>
  `;

  function renderItems(){
    const filtered=faqs.filter(item=>{
      const matchQ=!query||(item.question+item.shortAnswer+item.detailedAnswer).toLowerCase().includes(query.toLowerCase());
      const matchC=filter==='All'||item.category===filter;
      return matchQ && matchC;
    });

    $('#faqList').innerHTML=filtered.map((item,i)=>`
      <div class="card faq-card ${i===0?'open':''}" data-idx="${i}">
        <div class="faq-q">
          <div style="display:flex;align-items:center;gap:calc(var(--u)*12)">
            <span class="badge badge-blue">Q</span>
            <b>${item.question}</b>
          </div>
          <div style="display:flex;align-items:center;gap:calc(var(--u)*10)">
            <span class="badge badge-blue">${item.category}</span>
            <svg class="bp-chevron" viewBox="0 0 24 24" style="width:calc(var(--u)*18);height:calc(var(--u)*18);stroke:#fff;fill:none;stroke-width:2.2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="faq-ans">
          <div style="padding:calc(var(--u)*12) calc(var(--u)*16);background:rgba(23,159,252,.1);border-left:calc(var(--u)*4) solid var(--acc);border-radius:0 calc(var(--u)*8) calc(var(--u)*8) 0;margin-bottom:calc(var(--u)*12);font-weight:600;color:#fff">
            ${item.shortAnswer}
          </div>
          <div style="white-space:pre-line">${item.detailedAnswer}</div>
          ${item.relatedTerm?`
            <div style="margin-top:calc(var(--u)*14);padding-top:calc(var(--u)*10);border-top:1px solid rgba(255,255,255,.08)">
              <span style="font-size:calc(var(--u)*14);color:var(--muted)">Related Glossary Concept: </span>
              <a href="template.html?page=glossary&term=${encodeURIComponent(item.relatedTerm)}" class="gl-rel-tag">${item.relatedTerm} &rarr;</a>
            </div>
          `:''}
        </div>
      </div>
    `).join('');

    $$('.faq-card').forEach(c=>{
      c.addEventListener('click',e=>{
        if(e.target.tagName.toLowerCase()==='a') return;
        c.classList.toggle('open');
      });
    });
  }

  $('#faqSearch').addEventListener('input',e=>{ query=e.target.value; renderItems(); });
  $$('#faqChips .f-chip').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('#faqChips .f-chip').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      filter=b.dataset.cat;
      renderItems();
    });
  });

  renderItems();
}

/* ============================ DATA LOADING & ROUTER ============================ */
async function loadContentAndRoute(){
  try{
    const [resG, resT, resB, resF, resTop] = await Promise.all([
      fetch('content/glossary.json').then(r=>r.json()).catch(()=>[]),
      fetch('content/tutorials.json').then(r=>r.json()).catch(()=>[]),
      fetch('content/best-practices.json').then(r=>r.json()).catch(()=>[]),
      fetch('content/faqs.json').then(r=>r.json()).catch(()=>[]),
      fetch('content/topics.json').then(r=>r.json()).catch(()=>[])
    ]);

    GLOSSARY_DATA=resG;
    TUTORIALS_DATA=resT;
    BP_DATA=resB;
    FAQS_DATA=resF;
    TOPICS_DATA=resTop;

    if(page==='glossary'){
      renderGlossary(GLOSSARY_DATA);
    } else if(page==='tutorials'){
      renderTutorials(TUTORIALS_DATA);
    } else if(page==='best-practices'){
      renderBestPractices(BP_DATA);
    } else if(page==='faqs'){
      renderFaqs(FAQS_DATA);
    } else if(page==='topics'){
      renderTopics(TOPICS_DATA);
    } else if(page==='ml-lab'){
      window.location.replace('ml-lab.html');
    } else {
      renderGlossary(GLOSSARY_DATA);
    }
  }catch(err){
    console.error('Failed to load content JSON:', err);
    $('#content').innerHTML=`<div class="card" style="padding:calc(var(--u)*30);text-align:center;">Failed to load knowledge content: ${err.message}</div>`;
  }
}

loadContentAndRoute();

})();
